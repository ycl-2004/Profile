name: Check GitHub profile updates

on:
  schedule:
    # Twice monthly: enough for portfolio maintenance without noisy polling.
    - cron: '17 7 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: github-profile-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v7.0.1

      - name: Use Node.js 20
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20

      - name: Compare GitHub with the confirmed baseline
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-github-updates.mjs --github-output

      - name: Notify Yi-Chen once through an assigned issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PATH: ${{ steps.check.outputs.report_path }}
        run: |
          existing_issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq 'map(select(.title | startswith("[Profile Watch]"))) | .[0].number // empty')"
          if [ -n "$existing_issue" ]; then
            echo "Reminder already open as issue #$existing_issue; no duplicate notification created."
            exit 0
          fi
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --assignee "ycl-2004" \
            --title "[Profile Watch] GitHub changed — review the website" \
            --body-file "$REPORT_PATH"
